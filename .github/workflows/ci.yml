name: CI - AbAssurance Bloc 3

on:
  push:
    branches: [ feature/bloc3_correction, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: apache/spark:3.5.1-java17-python3
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer les dépendances Python
        run: |
          pip install --upgrade pip
          pip install pytest==8.2.0 pytest-cov==4.1.0 kafka-python-ng==2.2.3 psycopg2-binary==2.9.9 hdfs==2.7.0 pandas==2.2.0

      - name: Exécuter les tests
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh