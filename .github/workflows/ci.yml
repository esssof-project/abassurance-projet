name: CI - AbAssurance Bloc 3

on:
  push:
    branches: [ feature/bloc3_correction, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Installer Java 17 (nécessaire pour PySpark)
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.2.0 pytest-cov==4.1.0 kafka-python-ng==2.2.3 psycopg2-binary==2.9.9 hdfs==2.7.0

      - name: Installer PySpark 3.5.1
        run: |
          wget -q https://archive.apache.org/dist/spark/spark-3.5.1/spark-3.5.1-bin-hadoop3.tgz
          tar -xzf spark-3.5.1-bin-hadoop3.tgz -C $HOME
          echo "SPARK_HOME=$HOME/spark-3.5.1-bin-hadoop3" >> $GITHUB_ENV
          echo "$SPARK_HOME/bin" >> $GITHUB_PATH
          echo "$SPARK_HOME/python" >> $PYTHONPATH

      - name: Exécuter les tests
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh