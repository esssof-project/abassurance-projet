name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarCloud to detect changes

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: .
        args: >
          -Dsonar.organization=Pipeline-ESS
          # -Dsonar.projectKey=abassurance-project
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.python.xunit.reportPath=test-results.xml
          -Dsonar.sources=.
          -Dsonar.exclusions=**/tests/**,**/__pycache__/**,**/venv/**,**/.venv/**
          -Dsonar.test.inclusions=**/tests/**/*.py
          -Dsonar.coverage.exclusions=**/tests/**,**/conftest.py
          -Dsonar.python.version=3.11
          -Dsonar.coverage.minimum=80