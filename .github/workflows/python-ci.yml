name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarCloud to detect changes
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'  # Eclipse Temurin (recommandé)
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Test with coverage
      run: |
        pytest --cov=spark.streaming_pipeline --cov-config=.coveragerc --cov-report=xml:coverage.xml --cov-report=html --junitxml=test-results.xml -v

    - name: Trust SonarQube TLS certificate
      env:
        SONAR_CA_CERT: ${{ secrets.SONAR_CA_CERT }}
      run: |
        printf '%s\n' "$SONAR_CA_CERT" > "$RUNNER_TEMP/sonar-ca.crt"
        keytool -importcert -noprompt -trustcacerts -alias sonar-server \
          -file "$RUNNER_TEMP/sonar-ca.crt" \
          -keystore "$RUNNER_TEMP/sonar-truststore.p12" \
          -storetype PKCS12 -storepass changeit

    - name: SonarQube Server Scan
      uses: SonarSource/sonarqube-scan-action@v8.3.0
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_SCANNER_OPTS: >-
          -Djavax.net.ssl.trustStore=${{ runner.temp }}/sonar-truststore.p12
          -Djavax.net.ssl.trustStorePassword=changeit
