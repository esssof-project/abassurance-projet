name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required for SonarCloud to detect changes
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'  # Eclipse Temurin (recommandé)
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Lint with Ruff
      run: |
        ruff check .
        
    - name: Test with coverage
      run: |
        pytest --cov=./ --cov-report=xml:coverage.xml --cov-report=html --junitxml=test-results.xml -v
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: .
        args: >
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=esssofprojets
          -Dsonar.projectKey=Pipeline-ESS_absassurance-projet
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.python.xunit.reportPath=test-results.xml
          -Dsonar.sources=.
          -Dsonar.exclusions=**/tests/**,**/__pycache__/**,**/venv/**,**/.venv/**
          -Dsonar.test.inclusions=**/tests/**/*.py
          -Dsonar.coverage.exclusions=**/tests/**,**/conftest.py
          -Dsonar.python.version=3.11
          -Dsonar.coverage.minimum=80
