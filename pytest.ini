[pytest]
# Configuration pour pytest-cov
addopts = --cov=./ --cov-report=xml --cov-report=html -v

# Exclusions de couverture
cov_config = .coveragerc

# Sortie des rapports
junit_xml = test-results.xml

# Répertoire des tests
testpaths = tests

# Verbosité
verbose = 2

# Afficher les 10 tests les plus lents
-durations=10

# Arrêter après le premier échec
# failfast = true

# Optionnel : désactiver les warnings
filterwarnings = ignore::DeprecationWarning
