
[pytest]

# Configuration de la couverture
addopts =
    --cov=.
    --cov-config=.coveragerc
    --cov-report=xml
    --cov-report=html
    --cov-report=term-missing
    --junitxml=test-results.xml
    -v

# Répertoire des tests
testpaths = tests

# Convention de nommage
python_files = test_*.py
python_classes = Test*
python_functions = test_*
