services:

  # =========================================================
  # BASES SOURCES SIMULEES (version LEGERE pour la demo)
  # En production : Oracle (AbAssurance) / SQL Server (AssurePlus).
  # Pour la demo : 2 instances PostgreSQL alpines (~90 Mo, ~30 Mo RAM)
  # respectant les schemas de l'enonce (AB_* / AP_*).
  # wal_level=logical : indispensable pour la capture CDC (Debezium).
  # =========================================================
  db-abassur:
    image: postgres:16-alpine
    container_name: db-abassur
    command: ["postgres","-c","wal_level=logical","-c","max_replication_slots=10","-c","max_wal_senders=10"]
    environment:
      POSTGRES_DB: abassurance
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: Demo123!
    volumes:
      - ./oracle-init:/docker-entrypoint-initdb.d
      - pgab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d abassurance"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-assureplus:
    image: postgres:16-alpine
    container_name: db-assureplus
    command: ["postgres","-c","wal_level=logical","-c","max_replication_slots=10","-c","max_wal_senders=10"]
    environment:
      POSTGRES_DB: assureplus
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: Demo123!
    volumes:
      - ./sqlserver-init:/docker-entrypoint-initdb.d
      - pgap_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d assureplus"]
      interval: 5s
      timeout: 5s
      retries: 20

  # =========================================================
  # BUS DE DONNEES (Apache Kafka, mode KRaft, sans Zookeeper)
  # =========================================================
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # =========================================================
  # CDC TEMPS REEL (Debezium / Kafka Connect)
  # Capture chaque INSERT/UPDATE/DELETE des bases sources -> Kafka
  # =========================================================
  kafka-connect:
    image: debezium/connect:2.7.0.Final
    container_name: kafka-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy

  # =========================================================
  # DATA LAKE HADOOP (HDFS) — stockage terminal de l'architecture
  # =========================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
    env_file: ./hadoop.env
    ports:
      - "9870:9870"
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    env_file: ./hadoop.env
    depends_on:
      - namenode
    volumes:
      - datanode_data:/hadoop/dfs/data

  # =========================================================
  # MOTEUR DE TRAITEMENT (Apache Spark cluster, mode batch)
  # =========================================================
  spark-master:
    image: apache/spark:3.5.1-java17-python3
    container_name: spark-master
    command: /opt/spark/sbin/start-master.sh
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
    ports:
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark-apps

  spark-worker:
    image: apache/spark:3.5.1-java17-python3
    container_name: spark-worker
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark-apps

  # =========================================================
  # SPARK STREAMING (tourne en continu : consomme le CDC Kafka et
  # ecrit les evenements en Parquet dans HDFS — pas de base
  # intermediaire : Hadoop -> Dataviz, conforme a l'architecture)
  # =========================================================
  spark-streaming:
    image: apache/spark:3.5.1-java17-python3
    container_name: spark-streaming
    command: ["bash","-c","export HOME=/tmp && /opt/spark/bin/spark-submit --master 'local[*]' --conf spark.jars.ivy=/tmp/.ivy2 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 /opt/spark-apps/streaming_pipeline.py"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
    volumes:
      - ./spark:/opt/spark-apps

  # =========================================================
  # DATAVIZ (Streamlit + Plotly : dashboards Python qui lisent
  # le Data Lake HDFS via WebHDFS). Pas de port expose directement :
  # l'acces se fait UNIQUEMENT en HTTPS via Caddy.)
  # =========================================================
  dataviz:
    build: ./dataviz
    container_name: dataviz
    depends_on:
      - namenode

  # =========================================================
  # REVERSE PROXY HTTPS (Caddy, TLS interne + redirection HTTP->HTTPS)
  # Le Dataviz est accessible uniquement via
  # https://dashboard.abassurance.local (entree /etc/hosts requise)
  # =========================================================
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dataviz

  # =========================================================
  # PRODUCER "TALEND-LIKE" batch (demo du mode batch initial)
  # =========================================================
  producer:
    build: ./producer
    container_name: producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      AB_DB_HOST: db-abassur
      AB_DB_NAME: abassurance
      AP_DB_HOST: db-assureplus
      AP_DB_NAME: assureplus
      DB_USER: demo
      DB_PASSWORD: Demo123!
    depends_on:
      kafka:
        condition: service_healthy
      db-abassur:
        condition: service_healthy
      db-assureplus:
        condition: service_healthy

volumes:
  pgab_data: {}
  pgap_data: {}
  kafka_data: {}
  namenode_data: {}
  datanode_data: {}
  caddy_data: {}
  caddy_config: {}
